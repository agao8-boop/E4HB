<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Partner With E4H Energy</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
<style>
  :root { --navy: #0B1D3A; --amber: #F5A623; --off-white: #F7F5F0; --card-shadow: 0 8px 40px rgba(11,29,58,0.08); }
  body { font-family: 'DM Sans', sans-serif; background: var(--off-white); display: flex; flex-direction: column; min-height: 100vh; margin: 0; }
  nav { padding: 1.5rem 2.5rem; display: flex; align-items: center; justify-content: space-between; max-width: 1200px; margin: 0 auto; width: 100%; }
  .logo { font-family: 'DM Serif Display', serif; font-size: 1.55rem; color: var(--navy); text-decoration: none; }
  .signup-card { background: #fff; width: 100%; max-width: 480px; margin: auto; padding: 3.5rem 2.5rem; border-radius: 24px; box-shadow: var(--card-shadow); text-align: center; }
  input { width: 100%; padding: 1.1rem; border: 2px solid #E8E4DD; border-radius: 12px; margin-bottom: 2rem; }
  .btn-submit { width: 100%; background: var(--navy); color: #fff; padding: 1.1rem; border-radius: 12px; font-weight: 700; border: none; cursor: pointer; }
  #successMessage { display: none; }
</style>
</head>
<body>

<nav>
  <a href="LandingPageB.html" class="logo">E4<span>H</span> Partners</a>
  <a href="LandingPageB.html" style="text-decoration:none; color:#555; font-weight:600;">← Back</a>
</nav>

<div class="signup-card">
  <div id="formContainer">
    <h1>Strategic Partnership</h1>
    <p>Submit your organizational email to receive our deployment roadmap.</p>
    <form id="signupForm">
      <input type="hidden" name="source" value="Partner B2B Website">
      <input type="hidden" name="url" id="currentUrl">
      
      <label for="email" style="display:block; text-align:left; font-size:0.75rem; font-weight:700; margin-bottom:0.5rem;">INSTITUTIONAL EMAIL</label>
      <input type="email" id="email" name="email" placeholder="director@organization.org" required>
      <button type="submit" id="submitBtn" class="btn-submit">Request Partnership Deck →</button>
    </form>
  </div>

  <div id="successMessage">
    <div style="font-size: 3rem; margin-bottom: 1rem;">🤝</div>
    <h1>Request Received</h1>
    <p>Our team will reach out within 48 hours.</p>
    <a href="LandingPageB.html" style="color: var(--navy); font-weight: bold; text-decoration: none; border-bottom: 2px solid var(--amber);">Return to Portal</a>
  </div>
</div>

<script>
  document.getElementById('currentUrl').value = window.location.href;

  const scriptURL = 'YOUR_DEPLOYMENT_URL_HERE';
  const form = document.getElementById('signupForm');
  
  form.addEventListener('submit', e => {
    e.preventDefault();
    document.getElementById('submitBtn').innerText = 'Sending Request...';
    fetch(scriptURL, { method: 'POST', body: new FormData(form), mode: 'no-cors' })
      .then(() => {
        document.getElementById('formContainer').style.display = 'none';
        document.getElementById('successMessage').style.display = 'block';
      });
  });
</script>
</body>
</html>
