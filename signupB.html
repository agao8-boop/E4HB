<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Partner With E4H Energy</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
<style>
  :root { --navy: #0B1D3A; --navy-light: #132B52; --amber: #F5A623; --off-white: #F7F5F0; --text-mid: #555555; --card-shadow: 0 8px 40px rgba(11,29,58,0.08); }
  body { font-family: 'DM Sans', sans-serif; background: var(--off-white); display: flex; flex-direction: column; min-height: 100vh; margin: 0; }
  nav { padding: 2rem; display: flex; justify-content: space-between; max-width: 1200px; margin: 0 auto; width: 100%; box-sizing: border-box; }
  .logo { font-family: 'DM Serif Display', serif; font-size: 1.55rem; color: var(--navy); text-decoration: none; }
  .logo span { color: var(--amber); }
  .signup-card { background: #fff; width: 100%; max-width: 480px; margin: auto; padding: 3.5rem 2.5rem; border-radius: 24px; box-shadow: var(--card-shadow); text-align: center; }
  h1 { font-family: 'DM Serif Display', serif; color: var(--navy); font-size: 2.2rem; margin-bottom: 1rem; }
  p { color: var(--text-mid); margin-bottom: 2rem; }
  form { text-align: left; }
  label.field-label { display: block; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; color: var(--navy); margin-bottom: 0.6rem; }
  input[type="email"] { width: 100%; padding: 1.1rem; border: 2px solid #E8E4DD; border-radius: 12px; margin-bottom: 1.5rem; outline: none; box-sizing: border-box; }
  .radio-group { display: flex; flex-direction: column; gap: 0.8rem; margin-bottom: 2rem; }
  .radio-option { display: flex; align-items: center; padding: 1rem; border: 2px solid #E8E4DD; border-radius: 12px; cursor: pointer; transition: 0.2s; }
  .radio-option:hover { border-color: var(--amber); }
  .radio-option input { margin-right: 12px; width: 18px; height: 18px; accent-color: var(--navy); }
  .btn-submit { width: 100%; background: var(--navy); color: #fff; padding: 1.1rem; border-radius: 12px; font-weight: 700; border: none; cursor: pointer; }
  #successMessage { display: none; }
</style>
</head>
<body>
<nav>
  <a href="LandingPageB.html" class="logo">E4<span>H</span> Partners</a>
  <a href="LandingPageB.html" style="text-decoration:none; color:var(--text-mid); font-weight:600;">← Back</a>
</nav>

<div class="signup-card">
  <div id="formContainer">
    <h1>Strategic Partnership</h1>
    <p>Submit your email to receive our deployment roadmap.</p>
    <form id="signupForm">
      <input type="hidden" name="url" id="pageUrl">
      <div class="input-group">
        <label class="field-label">Institutional Email</label>
        <input type="email" name="email" placeholder="director@organization.org" required>
      </div>
      <div class="input-group">
        <label class="field-label">How will you use E4H?</label>
        <div class="radio-group">
          <label class="radio-option">
            <input type="radio" name="user_type" value="Individual Customer">
            <span>Personal use for my home</span>
          </label>
          <label class="radio-option">
            <input type="radio" name="user_type" value="Organization/Batch" checked>
            <span>Organization or batch procurement</span>
          </label>
        </div>
      </div>
      <button type="submit" id="submitBtn" class="btn-submit">Request Partnership Deck →</button>
    </form>
  </div>
  <div id="successMessage">
    <div style="font-size: 3rem; margin-bottom: 1rem;">🤝</div>
    <h1>Request Received</h1>
    <p>Our team will reach out within 48 hours.</p>
    <a href="LandingPageB.html" style="color: var(--navy); font-weight: bold; text-decoration: none; border-bottom: 2px solid var(--amber);">Return to Portal</a>
  </div>
</div>

<script>
  document.getElementById('pageUrl').value = window.location.href;
  const scriptURL = 'https://script.google.com/macros/s/AKfycbyJJq4VyU8Gt4mIqymhyIGHWgM8-zkiowum8y2kVS-1a_OmcG-36u3z9v3GKqr_uXFS/exec';
  const form = document.getElementById('signupForm');
  form.addEventListener('submit', e => {
    e.preventDefault();
    document.getElementById('submitBtn').innerText = 'Sending Request...';
    fetch(scriptURL, { method: 'POST', body: new FormData(form), mode: 'no-cors' })
      .then(() => {
        document.getElementById('formContainer').style.display = 'none';
        document.getElementById('successMessage').style.display = 'block';
      });
  });
</script>
</body>
</html>
